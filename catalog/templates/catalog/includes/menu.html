<nav class="my-2 my-md-0 mr-md-3">
    <a class="p-2 text-dark" href="{% url 'catalog:home' %}">Каталог</a>
    <a class="p-2 text-dark" href="{% url 'blog:blog_list' %}">Блог</a>
    <a class="p-2 text-dark" href="{% url 'catalog:contacts' %}">Контакты</a>

    {% if user.is_authenticated %}
    <a class="p-2 text-dark" href="{% url 'users:profile' %}">Профиль</a>
    <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
        {% csrf_token %}
        <button type="submit" class="p-2 text-dark btn btn-link"
            style="display: inline; cursor: pointer;">Выйти</button>
    </form>
    {% else %}
    <a class="p-2 text-dark" href="{% url 'users:login' %}">Войти</a>
    <a class="p-2 text-dark" href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
</nav>
