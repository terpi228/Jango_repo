<!-- catalog/templates/catalog/base.html -->
{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Skystore{% endblock %}</title>
    <style>
        .errorlist {
            color: red;
            list-style: none;
            padding-left: 0;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="{% static 'catalog/css/bootstrap.min.css' %}">
</head>
<body>

<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">TRPEBSstore</h5>
    <!-- Вкл меню из отдельного файла -->
    {% include 'catalog/includes/menu.html' %}
</div>

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">TRPEBSstore</h1>
    <p class="lead">TRPEBSstore - это отличный вариант хранения ваших плагинов и примеров кода, который вы бы хотели продать</p>
</div>



<div class="container">
    {% block content %}
    {% endblock %}
</div>


<footer class="pt-4 my-md-5 pt-md-5 border-top">
    <!-- здесь может быть футер-->
</footer>

<script src="{% static 'catalog/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
