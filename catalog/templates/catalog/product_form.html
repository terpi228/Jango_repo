{% extends 'catalog/base.html' %}

{% block content %}
<h2>Добавить товар</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
</form>
<a href="{% url 'catalog:home' %}">На главную</a>
{% endblock %}
