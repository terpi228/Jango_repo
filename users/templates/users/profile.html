{% extends 'catalog/base.html' %}

{% block content %}
<div class="container">
    <h2>Редактирование профиля</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
    <p><a href="{% url 'catalog:home' %}">На главную</a></p>
</div>
{% endblock %}
